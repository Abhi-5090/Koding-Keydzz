# Koding Keydzz — nginx reverse proxy + static frontend host.
#
# Intended setup:
#   - Terminate HTTP (add TLS via certbot / a load balancer in production).
#   - Proxy /api/*  -> the backend Express service (backend:5000 inside docker compose).
#   - Optionally serve the two pre-built Vite SPAs (student + admin) as static files,
#     each with SPA fallback to its index.html. If the frontends are deployed to
#     Vercel instead, you can delete the two `location` blocks that serve them.
#
# The frontends call the API at /api/v1 (see each app's VITE_API_URL). When served
# behind this proxy, set VITE_API_URL=/api/v1 so requests are same-origin.

upstream kk_backend {
    server backend:5000;
}

# gzip compression for text assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # ---- Security headers (apply to every response) ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Tighten this CSP to your asset/CDN origins in production.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self'" always;

    # Generous limit for Excel bulk-upload (xlsx) roster imports.
    client_max_body_size 25M;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://kk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (socket.io long-poll upgrade also passes through here).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ---- Socket.IO realtime (battle arena, live notifications) ----
    # The clients connect to the API ORIGIN at the default /socket.io/ path
    # (VITE_API_URL has /api/v1 stripped for the socket URL), so this MUST be
    # proxied separately from /api/ or realtime features silently fail.
    location /socket.io/ {
        proxy_pass http://kk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # keep long-lived websockets open
    }

    # ---- Student frontend (default site) ----
    # Mount "./Koding Keydzz Frontend/dist" at /usr/share/nginx/html/student
    location / {
        root /usr/share/nginx/html/student;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # ---- Admin portal under /admin ----
    # Mount "./Koding Keydzz Admin/dist" at /usr/share/nginx/html/admin
    location /admin {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;  # SPA fallback
    }

    # Cache hashed static assets aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html/student;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
