# Koding Keydzz — nginx reverse proxy + static frontend host.
#
# This config serves HTTPS and redirects all plaintext traffic to it. The
# platform handles children's personal data (names, school, progress) and
# bearer tokens, so plaintext HTTP is not an acceptable transport — an earlier
# version of this file listened only on :80.
#
# ---------------------------------------------------------------------------
# BEFORE FIRST DEPLOY — obtain certificates, e.g. with certbot:
#
#   certbot certonly --standalone -d app.example.com
#
# then mount them into the container and set the two ssl_certificate paths
# below. In docker-compose.yml:
#
#   nginx:
#     volumes:
#       - /etc/letsencrypt:/etc/letsencrypt:ro
#     ports:
#       - "80:80"
#       - "443:443"
#
# If you terminate TLS upstream instead (ALB / Cloudflare / Caddy), delete the
# 443 server block and keep only the :80 one, but make sure the upstream sets
# X-Forwarded-Proto — the API trusts it (app.set('trust proxy', 1)).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# API upstream.
#
# ONE instance today, which is why there is a single `server` line. If you add
# more, TWO things must change together or the product breaks in ways that log
# nothing:
#
#   1. Uncomment `ip_hash` below. Socket.IO's HTTP long-polling fallback sends
#      a handshake and then further requests that MUST reach the same instance;
#      round-robin breaks the connection with a 400 "Session ID unknown".
#   2. Set REDIS_URL on every instance (see src/sockets/index.js). Socket.IO
#      rooms live in one process's memory, so without a shared backplane a
#      notification emitted on instance A never reaches a pupil connected to
#      instance B — it is dropped silently.
#
# Even with both, live-duel MATCHMAKING stays per-instance (the waiting queue
# is in process memory), so two pupils on different instances will not be
# paired with each other. See DEPLOYMENT.md.
# ---------------------------------------------------------------------------
upstream kk_backend {
    # ip_hash;                # REQUIRED once there is more than one server line
    server backend:5000;
    # server backend2:5000;
}

# gzip compression for text assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ---------------------------------------------------------------------------
# Shared security headers + proxy behaviour.
# Included by the TLS server block below.
# ---------------------------------------------------------------------------

# ===========================================================================
# :80 — ACME challenge + permanent redirect to HTTPS.
# ===========================================================================
server {
    listen 80;
    server_name _;

    # Let certbot renew without taking the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===========================================================================
# :443 — the real site.
# ===========================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- TLS ----
    # Point these at your issued certificate. With certbot + the volume mount
    # described above the paths become:
    #   /etc/letsencrypt/live/<your-domain>/fullchain.pem
    #   /etc/letsencrypt/live/<your-domain>/privkey.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers (apply to every response) ----
    # HSTS: only meaningful over TLS, which is why it lives in this block.
    # Start with a short max-age while validating, then raise to 63072000.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Content Security Policy ----
    #
    # The Playground and the in-lesson "Try It" editors run student code in the
    # browser. That needs two things a naive `default-src 'self'` policy blocks,
    # and blocking them silently killed the entire interactive-coding feature in
    # production while it kept working in dev:
    #
    #   1. worker-src 'self' blob:
    #        The JavaScript runner executes in a Web Worker created from a
    #        Blob URL (see runners.js). Without blob: the worker never starts.
    #
    #   2. The Pyodide origin in script-src / connect-src / wasm.
    #        Python runs on Pyodide (CPython -> WebAssembly). SELF-HOSTING IS
    #        THE RECOMMENDED SETUP — see H-01 in DEPLOYMENT.md — because school
    #        networks routinely block public CDNs. When self-hosted from
    #        /pyodide/, 'self' already covers it and you can delete the
    #        cdn.jsdelivr.net entries below.
    #
    # 'wasm-unsafe-eval' is required for WebAssembly instantiation and is much
    # narrower than 'unsafe-eval' — it permits wasm compilation only, not
    # arbitrary JS eval.
    # Fonts are self-hosted (public/fonts), so fonts.googleapis.com and
    # fonts.gstatic.com are no longer allowed here — one fewer third party that
    # sees a pupil's IP, and one fewer host a school firewall can break.
    # cdn.jsdelivr.net is allowed for ONE reason only: the Pyodide CDN
    # fallback, used when VITE_PYODIDE_URL is unset. Monaco used to need it too
    # and no longer does (it is served from /monaco/ above), and the fonts used
    # to need fonts.googleapis.com and no longer do. If you self-host Pyodide —
    # which is recommended — this entry can be dropped as well, leaving the app
    # with no third-party origins at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Generous limit for Excel bulk-upload (xlsx) roster imports.
    client_max_body_size 25M;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://kk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (socket.io long-poll upgrade also passes through here).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Roster imports hash a password per student, so a large first-day
        # import legitimately takes minutes. The old 60s timeout returned 504
        # to the admin mid-import (which then created duplicates on retry).
        # The import itself is also capped and idempotent — see
        # studentBulkService — this timeout is the second half of that fix.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- Socket.IO realtime (battle arena, live notifications) ----
    # The clients connect to the API ORIGIN at the default /socket.io/ path
    # (VITE_API_URL has /api/v1 stripped for the socket URL), so this MUST be
    # proxied separately from /api/ or realtime features silently fail.
    location /socket.io/ {
        proxy_pass http://kk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # keep long-lived websockets open
    }

    # ---- Self-hosted Monaco (the code editor) ----
    # `npm run build` copies node_modules/monaco-editor/min/vs here, because
    # @monaco-editor/react ships only a loader and would otherwise fetch ~3 MB
    # from cdn.jsdelivr.net at runtime. On a network that filters public CDNs
    # that leaves the Playground and both programming games with a blank panel.
    #
    # A shorter cache than /pyodide/: this path is NOT version-pinned, so an
    # upgrade must not be masked by a 30-day immutable cache.
    location /monaco/ {
        root /usr/share/nginx/html/student;
        expires 7d;
        add_header Cache-Control "public";
        types {
            application/javascript js;
            text/css css;
            application/json json;
            font/woff2 woff2;
            image/svg+xml svg;
        }
        try_files $uri =404;
    }

    # ---- Self-hosted Pyodide (recommended) ----
    # Copy the Pyodide `full/` directory to
    #   Koding Keydzz Frontend/public/pyodide/v0.26.4/full/
    # and set VITE_PYODIDE_URL=/pyodide/v0.26.4/full/ so Python lessons work on
    # networks that block public CDNs. The long cache is safe: the path is
    # version-pinned.
    location /pyodide/ {
        root /usr/share/nginx/html/student;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # .wasm needs the right type for streaming compilation.
        types {
            application/wasm wasm;
            application/javascript js;
            application/json json;
            application/octet-stream zip;
        }
        try_files $uri =404;
    }

    # ---- Student frontend (default site) ----
    # Mount "./Koding Keydzz Frontend/dist" at /usr/share/nginx/html/student
    location / {
        root /usr/share/nginx/html/student;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # ---- Admin portal under /admin ----
    # Mount "./Koding Keydzz Admin/dist" at /usr/share/nginx/html/admin
    location /admin {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;  # SPA fallback
    }

    # Cache hashed static assets aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html/student;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
