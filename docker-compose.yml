# Koding Keydzz — local / single-host deployment stack.
#
#   mongo    : MongoDB 7 with a named volume for persistence
#   backend  : Express API (built from ./Koding Keydzz Backend) on :5000
#   nginx    : reverse proxy on :80 -> /api routed to backend, static frontends served
#
# Usage:
#   cp .env.example .env   # then fill in secrets
#   docker compose up -d --build
#
# Frontends (student app :5175 / admin :5176) are normally deployed to Vercel,
# but this compose file can also serve their pre-built dist/ via nginx (see nginx/nginx.conf).

services:
  mongo:
    image: mongo:7
    container_name: kk-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      # REQUIRED — no default. This previously fell back to "example", which
      # meant an operator who never set it shipped a database with a publicly
      # known root password.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env (use a long random value)}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-koding_keydzz}
    volumes:
      - mongo_data:/data/db
    # NOTE: no `ports:` mapping. The database is reachable only on the internal
    # compose network — publishing 27017 to the host exposed it to anything
    # that could reach the machine. To inspect it, use:
    #   docker compose exec mongo mongosh -u "$MONGO_ROOT_USERNAME" -p
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: "./Koding Keydzz Backend"
      dockerfile: Dockerfile
    container_name: kk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force production mode regardless of what the .env carries.
      NODE_ENV: production
      # Container listens on 5000 (matches the Dockerfile EXPOSE / nginx upstream).
      PORT: 5000
      # Override host-facing Mongo URI to point at the compose service.
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-koding_keydzz}?authSource=admin}
    depends_on:
      mongo:
        condition: service_healthy
    # Not published to the host: nginx reaches the API over the compose network
    # and is the only intended entry point (it terminates TLS). Publishing 5000
    # would let clients bypass nginx — and therefore bypass HTTPS and the
    # security headers.
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: kk-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"     # ACME challenge + redirect to HTTPS only
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates. Point this at your issued cert (e.g. certbot's
      # /etc/letsencrypt/live/<domain>/) — nginx.conf expects fullchain.pem and
      # privkey.pem inside /etc/nginx/certs.
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot for certbot HTTP-01 renewals.
      - ./nginx/certbot-webroot:/var/www/certbot
      # Mount pre-built frontends here if serving them via nginx instead of Vercel:
      # - "./Koding Keydzz Frontend/dist:/usr/share/nginx/html/student:ro"
      # - "./Koding Keydzz Admin/dist:/usr/share/nginx/html/admin:ro"

volumes:
  mongo_data:
    driver: local
