<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001621" />
    <meta name="description" content="Koding Keydzz — Learn Coding Through Adventure. A premium coding game for kids 6-16." />
    <title>Koding Keydzz</title>
    <!-- Fonts are served from THIS origin, not Google's CDN. School networks
         routinely block fonts.googleapis.com, and a CDN request would send
         every pupil's IP to a third party. See public/fonts/fonts.css. -->
    <!-- Installable on a school tablet, and gives the app its own window. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
